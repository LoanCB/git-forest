[package]
name = "git_forest"
version = "0.1.0"
description = "Git Forest"
authors = ["you"]
edition = "2021"

[lib]
# The `_lib` suffix avoids a name clash with the bin on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "git_forest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify-debouncer-mini = "0.5"
getrandom = "0.3"
tokio = { version = "1", features = ["sync", "rt", "process", "macros", "time", "io-util"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
url = "2"
semver = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Smaller binary, less memory mapped at runtime.
[profile.release]
codegen-units = 1
lto = true
strip = true
